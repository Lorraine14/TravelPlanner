<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripCraft</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <div id="navbar"></div>

    <section class="plan-page">
        <div class="plan-container">

            <div class="plan-header">
                <div class="plan-header-left">
                    <a href="trips.html" class="plan-back-btn">
                        <i class="fas fa-arrow-left"></i> Back to My Trips
                    </a>
                    <div class="plan-title-area">
                        <h1>Planning: <span class="highlight" id="planDestination">Trip</span></h1>
                        <select class="plan-status-select" id="planStatus">
                            <option value="planning">Planning</option>
                            <option value="upcoming">Upcoming</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="plan-header-right">
                    <button class="plan-save-btn" id="planSaveBtn">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
            </div>

            <div class="overview-card">
                <div class="overview-grid">
                    <div class="overview-item">
                        <label><i class="fas fa-map-pin"></i> Destination</label>
                        <input type="text" id="overviewDestination" />
                    </div>
                    <div class="overview-item">
                        <label><i class="fas fa-flag"></i> Country</label>
                        <input type="text" id="overviewCountry" />
                    </div>
                    <div class="overview-item">
                        <label><i class="fas fa-calendar-alt"></i> Start Date</label>
                        <input type="date" id="overviewStartDate" />
                    </div>
                    <div class="overview-item">
                        <label><i class="fas fa-calendar-alt"></i> End Date</label>
                        <input type="date" id="overviewEndDate" />
                    </div>
                    <div class="overview-item overview-full">
                        <label><i class="fas fa-coins"></i> Budget Range</label>
                        <input type="text" id="overviewBudget" placeholder="e.g. R1,500 - R2,800" />
                    </div>
                    <div class="overview-item overview-full">
                        <label><i class="fas fa-sticky-note"></i> Trip Notes</label>
                        <textarea id="overviewNotes" rows="2" placeholder="General notes about this trip..."></textarea>
                    </div>
                </div>
            </div>

            <div class="plan-layout">

                <div class="plan-sidebar" id="planSidebar">
                    <button class="plan-sidebar-btn active" data-section="itinerary">
                        <i class="fas fa-calendar-day"></i> Itinerary
                    </button>
                    <button class="plan-sidebar-btn" data-section="accommodation">
                        <i class="fas fa-hotel"></i> Hotels
                    </button>
                    <button class="plan-sidebar-btn" data-section="transport">
                        <i class="fas fa-plane"></i> Transport
                    </button>
                    <button class="plan-sidebar-btn" data-section="activities">
                        <i class="fas fa-ticket-alt"></i> Activities
                    </button>
                    <button class="plan-sidebar-btn" data-section="packing">
                        <i class="fas fa-suitcase"></i> Packing
                    </button>
                    <button class="plan-sidebar-btn" data-section="budget">
                        <i class="fas fa-wallet"></i> Budget
                    </button>
                    <button class="plan-sidebar-btn" data-section="journal">
                        <i class="fas fa-book"></i> Journal
                    </button>
                </div>

                <div class="plan-content">

                    <div class="plan-section active" id="sectionItinerary">
                        <div class="section-header">
                            <h2><i class="fas fa-calendar-day"></i> Itinerary</h2>
                            <button class="add-btn" id="addDayBtn"><i class="fas fa-plus"></i> Add Day</button>
                        </div>
                        <div id="itineraryContainer"></div>
                    </div>

                    <div class="plan-section" id="sectionAccommodation">
                        <div class="section-header">
                            <h2><i class="fas fa-hotel"></i> Accommodation</h2>
                            <button class="add-btn" id="addAccommodationBtn"><i class="fas fa-plus"></i> Add Hotel</button>
                        </div>
                        <div id="accommodationContainer"></div>
                    </div>

                    <div class="plan-section" id="sectionTransport">
                        <div class="section-header">
                            <h2><i class="fas fa-plane"></i> Transport</h2>
                            <button class="add-btn" id="addTransportBtn"><i class="fas fa-plus"></i> Add Transport</button>
                        </div>
                        <div id="transportContainer"></div>
                    </div>

                    <div class="plan-section" id="sectionActivities">
                        <div class="section-header">
                            <h2><i class="fas fa-ticket-alt"></i> Activities</h2>
                            <button class="add-btn" id="addActivityBtn"><i class="fas fa-plus"></i> Add Activity</button>
                        </div>
                        <div id="activitiesContainer"></div>
                    </div>

                    <div class="plan-section" id="sectionPacking">
                        <div class="section-header">
                            <h2><i class="fas fa-suitcase"></i> Packing List</h2>
                        </div>
                        <div id="packingContainer"></div>
                    </div>

                    <div class="plan-section" id="sectionBudget">
                        <div class="section-header">
                            <h2><i class="fas fa-wallet"></i> Budget Tracker</h2>
                        </div>
                        <div id="budgetContainer"></div>
                    </div>

                    <div class="plan-section" id="sectionJournal">
                        <div class="section-header">
                            <h2><i class="fas fa-book"></i> Notes & Journal</h2>
                        </div>
                        <div id="journalContainer"></div>
                    </div>

                </div>
            </div>

        </div>
    </section>

    <div id="footer"></div>

    <script src="js/script.js"></script>
</body>
</html>
