<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripCraft</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <div id="navbar"></div>

    <section class="trips-page">
        <div class="container">
            <div class="trips-header">
                <span class="header-icon"><i class="fas fa-suitcase"></i></span>
                <h1>My <span class="highlight">Trips</span></h1>
                <p>All your planned adventures and wishlist destinations in one place</p>
            </div>

            <div class="trips-stats">
                <div class="stat">
                    <span class="number" id="totalTrips">0</span>
                    <span class="label">Total Trips</span>
                </div>
                <div class="stat">
                    <span class="number" id="upcomingTrips">0</span>
                    <span class="label">Upcoming</span>
                </div>
                <div class="stat">
                    <span class="number" id="completedTrips">0</span>
                    <span class="label">Completed</span>
                </div>
                <div class="stat">
                    <span class="number" id="wishlistCount">0</span>
                    <span class="label">Wishlist</span>
                </div>
            </div>
        </div>

        <div class="tabs-layout">
            <div class="tabs-sidebar" id="tabsSidebar">
                <button class="tab-btn active" data-tab="trips">
                    <span><i class="fas fa-plane"></i> My Trips</span>
                    <span class="tab-badge" id="tripsBadge">0</span>
                </button>
                <button class="tab-btn" data-tab="wishlist">
                    <span><i class="fas fa-heart"></i> Wishlist</span>
                    <span class="tab-badge" id="wishlistBadge">0</span>
                </button>
                <button class="tab-btn" data-tab="all">
                    <span><i class="fas fa-th-list"></i> All</span>
                </button>
            </div>

            <div class="tab-content active" id="tabTrips">
                <div class="trips-grid" id="tripsGrid"></div>
            </div>

            <div class="tab-content" id="tabWishlist">
                <div class="trips-grid" id="wishlistGrid"></div>
            </div>

            <div class="tab-content" id="tabAll">
                <div class="all-info-banner">
                    <i class="fas fa-info-circle"></i>
                    <span>Showing all your trips and wishlist items together</span>
                </div>
                <div class="trips-grid" id="allGrid"></div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="js/script.js"></script>
</body>
</html>
