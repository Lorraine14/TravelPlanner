<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripCraft</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <div id="navbar"></div>

    <section class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon"><i class="fas fa-paper-plane"></i></span>
                <h1>Join <span class="highlight">TripCraft</span></h1>
                <p>Start planning your adventures today</p>
            </div>

            <div class="auth-error" id="authError">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage">Invalid username or password</span>
            </div>
            <div class="auth-success" id="authSuccess">
                <i class="fas fa-check-circle"></i>
                <span>Account created successfully! Redirecting to login...</span>
            </div>

            <form class="auth-form" id="signupForm" novalidate>
                <div class="form-group">
                    <label for="signupFirstname"><i class="fas fa-user"></i> First Name</label>
                    <input type="text" id="signupFirstname" placeholder="First name" required />
                </div>
				 
                <div class="form-group">
                   <label for="signupLastname"><i class="fas fa-user"></i> Last Name</label>
                   <input type="text" id="signupLastname" placeholder="Last name" required />
                </div>

                <div class="form-group">
                    <label for="signupUsername"><i class="fas fa-user-circle"></i> Username</label>
                    <input type="text" id="signupUsername" placeholder="Choose a username" required autocomplete="username" />
                    <span class="field-hint"><i class="fas fa-info-circle"></i> Must be at least 3 characters</span>
                </div>

                <div class="form-group">
                    <label for="signupEmail"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-toggle">
                        <input type="password" id="signupPassword" placeholder="Create a password" required autocomplete="new-password" />
                        <button type="button" class="toggle-eye" id="toggleSignupPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <span class="bar" id="strengthBar1"></span>
                        <span class="bar" id="strengthBar2"></span>
                        <span class="bar" id="strengthBar3"></span>
                    </div>
                    <span class="password-strength-label" id="strengthLabel">Enter a password</span>
                    <span class="field-hint"><i class="fas fa-info-circle"></i> At least 6 characters</span>
                </div>

                <div class="form-group">
                    <label for="signupConfirmPassword"><i class="fas fa-check-circle"></i> Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required autocomplete="new-password" />
                </div>

                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="js/script.js"></script>
</body>
</html>
